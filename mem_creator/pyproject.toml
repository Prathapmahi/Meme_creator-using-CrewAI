[project]
name = "mem_creator"
version = "0.1.0"
description = "mem_creator using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.105.0,<1.0.0"
]

[project.scripts]
mem_creator = "mem_creator.main:run"
run_crew = "mem_creator.main:run"
train = "mem_creator.main:train"
replay = "mem_creator.main:replay"
test = "mem_creator.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
